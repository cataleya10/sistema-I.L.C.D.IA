# ─── Sistema I.L.C.D.IA — Producción ───────────────────────────────────────
#
# ANTES DE ARRANCAR:
#   1. Copiar .env.deploy.example a .env  y completar TODOS los CHANGE_ME
#   2. Verificar que las imágenes estén publicadas en GHCR:
#        docker compose -f docker-compose.production.yml pull
#   3. Levantar:
#        docker compose -f docker-compose.production.yml up -d
#
# Variables requeridas en .env  (ver .env.deploy.example):
#   GITHUB_REPOSITORY, IMAGE_TAG, DB_USER, DB_PASSWORD,
#   Jwt__SigningKey, API_KEY, FRONTEND_ORIGIN, AUDIT_BASE_PATH (opcional)
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ilcdia
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ilcdia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal

  # ── AI Engine (Python / FastAPI) ─────────────────────────────────────────
  ai-engine:
    image: ghcr.io/${GITHUB_REPOSITORY}/ai-engine:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY}
      CORS_ORIGINS: ${FRONTEND_ORIGIN}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WORKERS: ${AI_WORKERS:-4}
      TIMEOUT: ${AI_TIMEOUT:-300}
      AUDIT_BASE_PATH: ${AUDIT_BASE_PATH:-/app/storage}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-claude-haiku-4-5-20251001}
      ENFORCE_PYTHON_RUNTIME: "true"
      REQUIRE_OCR_BACKEND: "true"
    volumes:
      - storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend .NET 8 ────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Database__Provider: Postgres
      # ConnectionStrings__Default sobreescribe appsettings.Production.json en runtime
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ilcdia;Username=${DB_USER};Password=${DB_PASSWORD};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=20;"
      Jwt__SigningKey: ${Jwt__SigningKey}
      PythonAi__BaseUrl: http://ai-engine:8000
      PythonAi__ApiKey: ${API_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      # ── Usuarios JWT (sobreescriben los CHANGE_ME de appsettings.Production.json) ──
      Jwt__Users__0__Username: ${ADMIN_USERNAME:-admin}
      Jwt__Users__0__PasswordHash: ${ADMIN_PASSWORD_HASH}
      Jwt__Users__0__Role: Admin
      Jwt__Users__1__Username: ${USER_USERNAME:-analyst}
      Jwt__Users__1__PasswordHash: ${USER_PASSWORD_HASH}
      Jwt__Users__1__Role: User
      Storage__RetentionDays: ${Storage__RetentionDays:-365}
      Storage__CleanupIntervalMinutes: ${Storage__CleanupIntervalMinutes:-43200}
      RefreshTokens__StoragePath: /app/storage/refresh_tokens.json
      DataProtection__KeysPath: /app/storage/data-protection-keys
      Google__ClientId: ${Google__ClientId:-}
    volumes:
      - storage:/app/storage
      - backend-logs:/app/logs
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal
      - frontend

  # ── Frontend Angular (nginx) ──────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend

# ── Volúmenes ────────────────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  storage:
    driver: local
  backend-logs:
    driver: local

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true        # postgres y ai-engine no son accesibles desde fuera
  frontend:
    driver: bridge
