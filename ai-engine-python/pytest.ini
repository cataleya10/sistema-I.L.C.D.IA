[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests *Test
python_functions = test_*

# pytest-asyncio: modo automático para corrutinas async
asyncio_mode = auto

# Markers registrados
markers =
    slow: tests de larga duración (excluir con -m "not slow")
    integration: tests que requieren servicios externos
    unit: tests unitarios puros

# Filtros de warnings — suprimir avisos esperados de dependencias
filterwarnings =
    ignore::DeprecationWarning:paddle.*
    ignore::DeprecationWarning:rapidocr.*
    ignore::DeprecationWarning:onnxruntime.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:spacy.*
    ignore::DeprecationWarning:pkg_resources.*

# Muestra los 10 tests más lentos
addopts = --tb=short -q --durations=10
