name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Scan NuGet vulnerabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projects = Get-ChildItem "backend-dotnet/src" -Recurse -Filter *.csproj | Select-Object -ExpandProperty FullName
          foreach ($project in $projects) {
            Write-Host "Scanning: $project"
            $output = dotnet list $project package --vulnerable --include-transitive --format json | Out-String
            $hasVulnerabilities = ($output -match '"severity"\s*:') -or ($output -match '"advisoryurl"\s*:')
            if ($hasVulnerabilities) {
              Write-Host $output
              throw "Vulnerabilities found in $project"
            }
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend-angular/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-angular/web
        run: npm ci

      - name: Scan npm vulnerabilities (prod)
        working-directory: frontend-angular/web
        run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build solution
        run: dotnet build backend-dotnet/Backend.slnx -c Release
      - name: Run backend tests
        run: dotnet test backend-dotnet/Backend.slnx -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend-angular/web/package-lock.json
      - name: Install deps
        working-directory: frontend-angular/web
        run: npm ci
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run frontend tests
        working-directory: frontend-angular/web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build
        working-directory: frontend-angular/web
        run: npm run build

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-engine-python/requirements.txt
      - name: Install dependencies
        working-directory: ai-engine-python
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall ai-engine-python/app
      - name: Run AI tests
        working-directory: ai-engine-python
        run: python -m unittest discover -s tests -p "test_*.py" -v
