stages:
  - security
  - test

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

security:
  stage: security
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - |
      set -eu
      failed=0
      for project in $(find backend-dotnet/src -name "*.csproj"); do
        echo "Scanning NuGet vulnerabilities: $project"
        output="$(dotnet list "$project" package --vulnerable --include-transitive || true)"
        echo "$output"
        if echo "$output" | grep -Ei "has the following vulnerable packages|tiene los paquetes vulnerables siguientes" >/dev/null; then
          echo "NuGet vulnerabilities found in $project"
          failed=1
        fi
      done
      if [ "$failed" -ne 0 ]; then
        exit 1
      fi

backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet build backend-dotnet/Backend.slnx -c Release
    - dotnet test backend-dotnet/Backend.slnx -c Release --no-build --verbosity normal

frontend:
  stage: test
  image: node:24-bullseye
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - cd frontend-angular/web
    - npm ci
  script:
    - npm audit --omit=dev
    - CHROME_BIN=/usr/bin/chromium npm test -- --watch=false --browsers=ChromeHeadless
    - npm run build

ai-engine:
  stage: test
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update
    - apt-get install -y libgl1 libglib2.0-0
    - cd ai-engine-python
    - pip install -r requirements.txt
  script:
    - python -m compileall app
    - python -m unittest discover -s tests -p "test_*.py" -v

