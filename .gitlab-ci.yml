stages:
  - security
  - test
  - build
  - deploy

variables:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}
  IMAGE_TAG: ${CI_COMMIT_SHA}

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

security:
  stage: security
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - |
      set -eu
      failed=0
      for project in $(find backend-dotnet/src -name "*.csproj"); do
        echo "Scanning NuGet vulnerabilities: $project"
        output="$(dotnet list "$project" package --vulnerable --include-transitive || true)"
        echo "$output"
        if echo "$output" | grep -Ei "has the following vulnerable packages|tiene los paquetes vulnerables siguientes" >/dev/null; then
          echo "NuGet vulnerabilities found in $project"
          failed=1
        fi
      done
      if [ "$failed" -ne 0 ]; then
        exit 1
      fi

backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet build backend-dotnet/src/Api/Api.csproj -c Release
    - dotnet test backend-dotnet/tests/Infrastructure.Tests/Infrastructure.Tests.csproj -c Release --verbosity normal

frontend:
  stage: test
  image: node:24-bullseye
  before_script:
    - apt-get update
    - apt-get install -y chromium
    - chown -R node:node "$CI_PROJECT_DIR"
  script:
    - su node -s /bin/bash -c "cd \"$CI_PROJECT_DIR/frontend-angular/web\" && npm ci"
    - su node -s /bin/bash -c "cd \"$CI_PROJECT_DIR/frontend-angular/web\" && npm audit --omit=dev"
    - su node -s /bin/bash -c "cd \"$CI_PROJECT_DIR/frontend-angular/web\" && CHROME_BIN=/usr/bin/chromium npm test -- --watch=false --browsers=ChromeHeadless"
    - su node -s /bin/bash -c "cd \"$CI_PROJECT_DIR/frontend-angular/web\" && npm run build"

ai-engine:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PAYROLL_STRICT_MODE: "1"
  before_script:
    - apt-get update
    - apt-get install -y libgl1 libglib2.0-0
    - cd ai-engine-python
    - pip install -r requirements.txt
  script:
    - python tools/check_runtime.py
    - python -m compileall app
    - python tools/run_regressions.py
    - python -m unittest discover -s tests -p "test_*.py" -v

# ── Build Docker images ────────────────────────────────────────────────────────

.build-image: &build-image
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

build-backend:
  <<: *build-image
  script:
    - docker build -t "$IMAGE_PREFIX/backend:$IMAGE_TAG" -t "$IMAGE_PREFIX/backend:latest" backend-dotnet/
    - docker push "$IMAGE_PREFIX/backend:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/backend:latest"

build-ai-engine:
  <<: *build-image
  script:
    - docker build -t "$IMAGE_PREFIX/ai-engine:$IMAGE_TAG" -t "$IMAGE_PREFIX/ai-engine:latest" ai-engine-python/
    - docker push "$IMAGE_PREFIX/ai-engine:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/ai-engine:latest"

build-frontend:
  <<: *build-image
  script:
    - docker build -t "$IMAGE_PREFIX/frontend:$IMAGE_TAG" -t "$IMAGE_PREFIX/frontend:latest" frontend-angular/web/
    - docker push "$IMAGE_PREFIX/frontend:$IMAGE_TAG"
    - docker push "$IMAGE_PREFIX/frontend:latest"

# ── Deploy to production ───────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - install -m 600 /dev/null /tmp/deploy_key
    - echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
  script:
    - |
      ssh -i /tmp/deploy_key \
          -o StrictHostKeyChecking=no \
          -o BatchMode=yes \
          "${DEPLOY_USER}@${DEPLOY_HOST}" \
          "cd /opt/ilcdia &&
           IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.production.yml pull &&
           IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.production.yml up -d --remove-orphans &&
           docker image prune -f"
  after_script:
    - rm -f /tmp/deploy_key
  environment:
    name: production
    url: $DEPLOY_APP_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - build-backend
    - build-ai-engine
    - build-frontend
